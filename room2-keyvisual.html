/* =====================================================================

/* ---------- Tokens ---------- */
:root{
  --bg:#FFFFFF; --ink:#000000; --muted:#4A4A4A; --rule:rgba(0,0,0,.12); --rule-2:rgba(0,0,0,.26); --band:#F3F3F1;

  --inv-bg:#000000; --inv-ink:#FFFFFF; --inv-muted:#B5B5B5; --inv-rule:rgba(255,255,255,.22);
  --gutter:clamp(20px,4vw,56px); --max:1440px;
  /* aliases usados pelo template do wireframe */
  --fg:var(--ink); --fg2:#2A2A2A; --faint:#5A5A5A; --border:var(--rule); --border-2:var(--rule-2); --surface:var(--bg); --pad:var(--gutter);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#000000; --ink:#FFFFFF; --muted:#B5B5B5; --rule:rgba(255,255,255,.16); --rule-2:rgba(255,255,255,.32); --band:#111111;
    --fg2:#DADADA; --faint:#A8A8A8; --inv-bg:#FFFFFF; --inv-ink:#000000; --inv-muted:#4A4A4A; --inv-rule:rgba(0,0,0,.14); color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#000000; --ink:#FFFFFF; --muted:#B5B5B5; --rule:rgba(255,255,255,.16); --rule-2:rgba(255,255,255,.32); --band:#111111;
  --fg2:#DADADA; --faint:#A8A8A8; --inv-bg:#FFFFFF; --inv-ink:#000000; --inv-muted:#4A4A4A; --inv-rule:rgba(0,0,0,.14); color-scheme:dark; }

/* Superfícies com tokens locais */
.inverse,.moment{ --bg:var(--inv-bg); --ink:var(--inv-ink); --fg:var(--inv-ink); --muted:var(--inv-muted); --fg2:var(--inv-muted); --rule:var(--inv-rule); --rule-2:var(--inv-rule); background:var(--bg); color:var(--ink); }
.always-dark,.site-footer,.cookie{ --bg:#000000; --ink:#FFFFFF; --fg:#FFFFFF; --muted:#B5B5B5; --fg2:#D0D0D0; --faint:#A8A8A8; --rule:rgba(255,255,255,.2); --rule-2:rgba(255,255,255,.34); background:#000; color:#fff; }
.on-yellow,.cta{ --bg:var(--yellow); --ink:#000000; --fg:#000; --muted:#3A3A3A; --fg2:#2A2A2A; --faint:#3A3A3A; --rule:rgba(0,0,0,.2); --rule-2:rgba(0,0,0,.4); background:var(--yellow); color:#000; }
.light{ background:var(--band); }

/* ---------- Base ---------- */
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px); background:var(--bg); }

.wrap{ max-width:var(--max); margin-inline:auto; padding-inline:var(--gutter); }

/* ---------- Tipografia ---------- */

.lead{ font-size:clamp(1.0625rem,1.3vw,1.1875rem); line-height:1.55; color:var(--muted); max-width:56ch; }
.body{ font-size:16px; line-height:1.6; color:var(--muted); }

.link:hover{ text-decoration:none; }

/* ---------- Botões (chanfro da marca) ---------- */
.btn{ --c:14px; --t:1.5px; position:relative; isolation:isolate; display:inline-flex; align-items:center; justify-content:center; gap:.55em;
      min-height:56px; padding:0 28px; font-weight:600; font-size:17px; letter-spacing:-.01em; line-height:1; white-space:nowrap; cursor:pointer; transition:color .2s ease; }
.btn::before,.btn::after{ content:""; position:absolute; z-index:-1; }

.btn::after{ inset:var(--t); clip-path:polygon(0 0,calc(100% - var(--c) + 1px) 0,100% calc(var(--c) - 1px),100% 100%,0 100%); transition:background-color .2s ease; }
.btn-solid{ color:var(--on-accent); } .btn-solid::after{ background:var(--yellow); }
.btn-solid:hover{ color:var(--bg); } .btn-solid:hover::after{ background:var(--ink); }
.btn-line{ color:var(--ink); } .btn-line::after{ background:var(--bg); }

.icon-btn{ width:48px; height:48px; display:inline-grid; place-items:center; border:1.5px solid var(--ink) !important; color:var(--ink); transition:background-color .2s,color .2s,opacity .2s; }
.icon-btn:hover:not(:disabled){ background:var(--ink); color:var(--bg); }
.icon-btn:disabled{ opacity:.28; cursor:default; }

/* ---------- Logótipo ---------- */
.logo{ display:inline-flex; align-items:baseline; border:1.5px solid currentColor; padding:1px 7px 3px; font-weight:500; font-size:22px; line-height:1; letter-spacing:-.03em; }

/* ---------- Header ---------- */
.site-header{ position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:var(--bg); border-bottom:1px solid var(--rule); }
.site-header .bar{ display:flex; align-items:center; justify-content:space-between; gap:24px; height:72px; }

@media (min-width:1024px){ .site-header .sig{ display:block; } }

.nav a{ position:relative; padding:6px 0; }
.nav a::after{ content:""; position:absolute; left:0; right:0; bottom:-2px; height:1.5px; background:var(--ink); transform:scaleX(0); transform-origin:left; transition:transform .25s ease; }

/* ---------- Badge ---------- */
.badge{ display:inline-flex; align-items:center; gap:10px; background:var(--ink); color:var(--bg); font-weight:500; font-size:15px; line-height:1.1;
        padding:10px 18px 10px 12px; clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px)); }

/* ---------- “Room to …” (bloco de palavra) ---------- */
.word-row{ display:flex; align-items:center; gap:.12em; margin-top:.06em; }
.word-block{ --k:.26em; position:relative; display:inline-block; height:1.12em; overflow:hidden; padding:0 .16em 0 .12em; white-space:nowrap;
  background:var(--yellow); color:var(--on-accent);
  clip-path:polygon(0 0,calc(100% - var(--k)) 0,100% var(--k),100% 100%,var(--k) 100%,0 calc(100% - var(--k)));
  transition:width .6s cubic-bezier(.7,0,.2,1), background-color .6s ease, color .6s ease; }
.word-block.is-b{ background:var(--blue); color:var(--on-accent); }
.word-block.is-k{ background:var(--ink); color:var(--bg); }
.word{ display:block; line-height:1.12em; white-space:nowrap; transition:transform .38s cubic-bezier(.7,0,.2,1), opacity .3s ease; }
.word.out{ transform:translateY(-105%); opacity:0; }
.word.pre{ transform:translateY(105%); opacity:0; transition:none; }
.word-measure{ position:absolute; visibility:hidden; white-space:nowrap; padding:0 .16em 0 .12em; pointer-events:none; }
.ellipsis{ display:none; }
.motion-toggle{ font-size:16px; letter-spacing:0; width:36px; height:36px; display:inline-grid; place-items:center; color:var(--muted); border:1.5px solid var(--rule); align-self:flex-end; margin-bottom:.4rem; transition:color .2s,border-color .2s; }
.motion-toggle:hover{ color:var(--ink); border-color:var(--ink); }

/* ---------- Key visual: imagem a toda a largura + painel recortado ---------- */
.hero{ position:relative; }
.hero-media{ position:relative; height:clamp(340px,62vw,520px); }
.photo-full{ --c:clamp(56px,7vw,128px); position:absolute; inset:0; overflow:hidden; background:#9a9a9a;
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--c) * 1.5),calc(100% - var(--c)) 100%,0 100%); }

.hero-stage{ position:relative; display:flex; align-items:flex-end; }
.hero-panel{ --k:clamp(40px,5vw,88px); position:relative; z-index:1; width:100%; background:var(--bg); margin-top:-56px;
  padding:clamp(28px,4vw,56px) var(--gutter) clamp(40px,5vw,72px);
  clip-path:polygon(0 0,calc(100% - var(--k)) 0,100% var(--k),100% 100%,0 100%); }
.hero-panel .display{ font-size:clamp(3.5rem,7.4vw,8.25rem); margin-top:clamp(22px,2.4vw,32px); }

.hero-panel h1{ margin-top:8px; font-size:clamp(1.5rem,2.25vw,2.125rem); line-height:1.15; font-weight:500; letter-spacing:-.025em; max-width:30ch; }

@media (min-width:640px){ .hero-panel{ margin-top:-80px; } }
@media (min-width:1024px){

}

/* Cabeçalho só de texto (Suporte, Contactos, páginas legais) */
.page-head{ position:relative; overflow:hidden; border-bottom:1.5px solid var(--ink); }

/* ---------- Placeholders fotográficos (substituir por fotografia real) ---------- */
.ph{ position:relative; overflow:hidden; background:#9a9a9a; width:100%; }
.ph svg{ filter:grayscale(1) contrast(1.04); transition:transform .6s cubic-bezier(.2,.7,.2,1); }

/* Cartões de tipologia */

/* Tabela de preços */

/* ---------- Banda de chamada (amarela, com símbolos da marca) ---------- */
.cta{ --s:clamp(28px,4vw,64px); position:relative; isolation:isolate; overflow:hidden;
  padding:calc(var(--s) + clamp(72px,8vw,128px)) max(var(--gutter),calc((100vw - var(--max)) / 2 + var(--gutter))) clamp(72px,8vw,128px);
  clip-path:polygon(0 var(--s),58% var(--s),calc(58% + var(--s)) 0,100% 0,100% 100%,0 100%); display:flex; flex-direction:column; align-items:flex-start; gap:18px; }
.cta .angle{ position:absolute; z-index:-1; right:max(var(--gutter),calc((100vw - var(--max)) / 2 + var(--gutter))); bottom:clamp(48px,7vw,104px);
  width:clamp(120px,18vw,260px); aspect-ratio:225/108; background:#000; clip-path:polygon(0 53.7%,25.8% 0,47.1% 0,47.1% 40.7%,66.7% 40.7%,86.2% 0,100% 0,100% 57.4%,79.6% 100%,0 100%); }
.cta-quote{ font-weight:500; font-size:clamp(2.75rem,7vw,7rem); line-height:.98; letter-spacing:-.05em; max-width:14ch; text-wrap:balance; }
.cta .h2{ max-width:20ch; }
.cta .cta-quote + .h2{ font-size:clamp(1.5rem,2.4vw,2.25rem); letter-spacing:-.03em; margin-top:12px; }
.cta .body{ color:#2A2A2A; max-width:52ch; font-size:18px; }

.handoff svg{ margin-top:1px; }
@media (max-width:767px){ .cta .angle{ display:none; } }

/* Momento de marca (citação) */
.moment{ position:relative; padding:clamp(88px,10vw,160px) max(var(--gutter),calc((100vw - var(--max)) / 2 + var(--gutter))); }
.moment .angle{ display:block; width:clamp(72px,8vw,120px); aspect-ratio:290/115; background:var(--yellow); margin-bottom:36px;
  clip-path:polygon(0 0,87.9% 0,100% 43.5%,100% 100%,80% 100%,65.5% 47.8%,0 47.8%); }

/* Cross-sell “Room to grow.” */
.xsell{ display:grid; gap:clamp(28px,4vw,64px); align-items:center; grid-template-columns:1fr; }
.xsell .ph{ aspect-ratio:4/3; clip-path:polygon(0 0,32% 0,32% 40px,60% 40px,calc(60% + 40px) 0,100% 0,100% calc(100% - 56px),calc(100% - 56px) 100%,0 100%); }
.xsell .in{ display:flex; flex-direction:column; gap:18px; align-items:flex-start; }
.xsell .display{ font-size:clamp(3rem,6vw,6.5rem); }

/* ---------- Suporte (FAQ) ---------- */
.faq-nav{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:clamp(48px,6vw,80px); }
.faq-nav a{ display:inline-flex; align-items:center; height:40px; padding:0 16px; font-size:15px; font-weight:500; border:1.5px solid var(--ink); transition:background-color .2s,color .2s; }

.faq-list summary:hover{ text-decoration:underline; text-underline-offset:4px; }
.ans{ display:flex; flex-direction:column; gap:10px; padding:0 0 24px; font-size:16px; line-height:1.6; color:var(--muted); max-width:68ch; }

/* ---------- Contactos ---------- */

.field input,.field select,.field textarea{ font:inherit; font-size:16px; color:var(--ink); background:var(--bg); border:1.5px solid var(--ink); border-radius:0; padding:14px 14px; width:100%; }

       clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%); }

/* ---------- Páginas legais e 404 ---------- */

/* ---------- Homepage ---------- */
.selector{ display:grid; gap:56px 32px; grid-template-columns:1fr; }

.vgroup{ display:flex; flex-direction:column; }

  background:var(--tone); clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%); }

.need{ position:relative; isolation:isolate; display:flex; flex-direction:column; gap:16px; padding:10px 10px 18px; transition:color .25s ease; }
.need::before{ content:""; position:absolute; inset:0; z-index:-1; background:var(--tone); opacity:0; transition:opacity .25s ease;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%); }

.need .term{ font-weight:500; font-size:clamp(1.25rem,2vw,1.875rem); letter-spacing:-.03em; line-height:1.05; }

@media (max-width:639px){ .need .ph{ aspect-ratio:16/10; } .need{ padding:6px 6px 14px; } }

.cut-top{ --s:clamp(28px,4vw,64px); clip-path:polygon(0 var(--s),58% var(--s),calc(58% + var(--s)) 0,100% 0,100% 100%,0 100%); }
.trust{ padding-top:calc(var(--s) + clamp(44px,5vw,72px)); padding-bottom:clamp(56px,6vw,88px); }

.trust-list li{ border-top:1.5px solid var(--rule); padding-top:26px; }

.step{ width:100%; display:grid; grid-template-columns:auto 1fr; gap:20px; text-align:left; padding:26px 0; border-top:1.5px solid var(--rule); color:var(--muted); transition:color .25s,border-color .25s; }
.step:last-child{ border-bottom:1.5px solid var(--rule); }

.how{ display:grid; gap:56px 32px; align-items:center; grid-template-columns:1fr; }
@media (min-width:1024px){ .how{ grid-template-columns:6fr 5fr; gap:96px; } }

.phone-stage{ position:relative; display:grid; place-items:center; padding:28px 0; width:100%; }

.phone{ position:relative; z-index:1; width:296px; aspect-ratio:296/612; background:#000; border-radius:46px; padding:11px; box-shadow:0 0 0 1.5px #3a3a3a,0 40px 80px -36px rgba(0,0,0,.5); }
.screen{ position:relative; height:100%; border-radius:36px; background:#fff; color:#000; overflow:hidden; font-size:14px; }
.island{ position:absolute; top:10px; left:50%; width:88px; height:26px; margin-left:-44px; background:#000; border-radius:20px; z-index:2; }
.scr{ position:absolute; inset:0; padding:52px 18px 20px; display:flex; flex-direction:column; gap:10px; opacity:0; transform:translateX(18px); transition:opacity .35s ease,transform .35s ease; pointer-events:none; }
.scr.on{ opacity:1; transform:none; pointer-events:auto; }
.logo-mini{ display:inline-flex; align-items:baseline; border:1.25px solid #000; padding:0 4px 1px; font-weight:500; font-size:13px; line-height:1; letter-spacing:-.03em; }

.opt{ display:flex; align-items:center; gap:10px; padding:11px 12px; border:1.25px solid #000; font-size:13px; line-height:1.25; }
.opt.sel{ background:var(--yellow); }
.prow{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #e2e2e2; font-size:13px; }
.pbtn{ position:relative; isolation:isolate; height:46px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:600; font-size:14px; width:100%; color:#000; }
.pbtn::before{ content:""; position:absolute; inset:0; z-index:-1; background:#000; clip-path:polygon(0 0,calc(100% - 11px) 0,100% 11px,100% 100%,0 100%); }

.pbtn.yel::after{ content:""; position:absolute; inset:1.5px; z-index:-1; background:var(--yellow); clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%); transition:background-color .3s; }

.rail{ display:flex; gap:clamp(12px,1.6vw,24px); overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;
  padding-inline:max(var(--gutter),calc((100vw - var(--max)) / 2 + var(--gutter))); scroll-padding-inline:max(var(--gutter),calc((100vw - var(--max)) / 2 + var(--gutter))); }
.rail::-webkit-scrollbar{ display:none; }

.poster{ font-weight:500; font-size:clamp(3.25rem,10.5vw,10.5rem); line-height:.98; letter-spacing:-.05em; }

/* ---------- Diálogo de ligações externas ---------- */

/* ---------- Cookies ---------- */

  padding:22px 22px 20px; display:flex; flex-direction:column; gap:16px; font-size:14px; line-height:1.5;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%); box-shadow:0 20px 50px -20px rgba(0,0,0,.6); }

/* ---------- Entrada (uma vez, no carregamento) ---------- */
@media (prefers-reduced-motion:no-preference){
  .reveal{ opacity:0; transform:translateY(14px); animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:var(--delay,0s); }
  .reveal-photo{ clip-path:inset(0 0 0 100%); animation:wipe 1s cubic-bezier(.7,0,.2,1) .15s forwards; }
  @keyframes rise{ to{ opacity:1; transform:none; } }
  @keyframes wipe{ to{ clip-path:inset(0 0 0 0); } }
}
@media (prefers-reduced-motion:reduce){
  .ellipsis{ display:inline; }
  .word-row.anim{ display:none; }
  *{ scroll-behavior:auto !important; }
}


.page-head .kicker{ display:inline-flex; align-items:center; gap:10px; background:var(--ink); color:var(--bg); font-weight:500; font-size:15px; line-height:1.1;
  padding:10px 18px 10px 14px; clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px)); }
@media (max-width:767px){ .page-head .head-sym{ width:140px; opacity:.9; } }

/* ---------- Guia de tamanhos ---------- */
.sguide{ display:grid; gap:36px 56px; grid-template-columns:1fr; padding:clamp(24px,3vw,44px); border:1.5px solid var(--ink); margin-bottom:clamp(48px,5vw,72px); }
@media (min-width:1024px){ .sguide{ grid-template-columns:1fr 1fr; } }
.sg-opts{ border:0; padding:0; margin:22px 0 0; display:flex; flex-wrap:wrap; gap:8px; min-width:0; }
.sg-chip{ position:relative; }
.sg-chip input{ position:absolute; opacity:0; width:1px; height:1px; }
.sg-chip span{ display:inline-flex; align-items:center; min-height:42px; padding:6px 14px; border:1.5px solid var(--ink); font-size:15px; font-weight:500; cursor:pointer; transition:background-color .2s,color .2s; }
.sg-chip span:hover{ background:var(--blue); color:#000; }
.sg-chip input:checked + span{ background:var(--ink); color:var(--bg); }
.sg-chip input:focus-visible + span{ outline:3px solid var(--ink); outline-offset:3px; }
.sg-boxes{ display:flex; align-items:flex-end; gap:clamp(10px,1.4vw,20px); height:clamp(150px,14vw,200px); }
.sg-b{ flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; gap:10px; }
.sg-sq{ display:block; width:var(--s); aspect-ratio:1; border:1.5px solid var(--ink); background:transparent; transition:background-color .3s ease; }
.sg-b.on .sg-sq{ background:var(--yellow); }
.sg-l{ font-size:13px; line-height:1.3; color:var(--muted); }
.sg-l b{ color:var(--ink); font-weight:600; }
.sg-out{ margin-top:24px; padding-top:20px; border-top:1px solid var(--rule); min-height:120px; }
.sg-res{ font-size:clamp(1.5rem,2.2vw,2rem); font-weight:500; letter-spacing:-.03em; }
.sg-res b{ font-weight:600; }
.card.unit.is-match{ outline:2px solid var(--ink); outline-offset:12px; }
.card.unit.is-match .tag{ background:var(--ink); color:var(--bg); }

/* ---------- Modo “Direção de fotografia” ---------- */
.pd-toggle{ position:fixed; z-index:65; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:inline-flex; align-items:center; gap:10px;
  min-height:44px; padding:0 16px 0 14px; background:#000; color:#fff; font-size:14px; font-weight:500;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%); box-shadow:0 12px 30px -12px rgba(0,0,0,.5); }
.pd-toggle[aria-pressed="true"]{ background:var(--yellow); color:#000; }
html{ --pd-label:"Fotografia a produzir: "; }
html[lang="en"]{ --pd-label:"Photo to shoot: "; }
.ph-mode [data-desc]::after{ content:var(--pd-label) attr(data-desc); position:absolute; z-index:4; left:12px; bottom:12px; max-width:min(340px,calc(100% - 24px));
  background:#fff; color:#000; font-size:12.5px; line-height:1.4; font-weight:500; padding:9px 12px; clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);
  box-shadow:0 8px 24px -10px rgba(0,0,0,.5); }
.ph-mode .hero-media [data-desc]::after{ left:auto; bottom:auto; top:16px; right:max(12px,var(--gutter)); max-width:min(380px,calc(100% - 24px)); }
@media (max-width:639px){ .pd-toggle span{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); } .pd-toggle{ padding:0 14px; } }

const sceneFor = (kind, desc) => {
  if (kind === "map") return "map";
  const d = String(desc && typeof desc === "object" ? desc.pt : (desc || "")).toLowerCase();
  const rules = [[/corredor/,"corridor"],[/chave digital|smartphone/,"entry"],[/copa|phone booth/,"pantry"],[/porta-paletes|paletes|descarga|rampa/,"dock"],
    [/reuni|mesa oval|ecrã/,"meeting"],[/edifício|fachada/,"facade"],[/secretária fixa|cacifo|portátil|posto/,"desk"],[/open space/,"cowork"],
    [/escritório|sala vazia|duas pessoas/,"office"],[/prateleira|estante|calçado|stock|arquivo/,"shelves"],[/caixa|mudança|bicicleta|box/,"boxes"]];
  for (const r of rules) if (r[0].test(d)) return r[1];
  return "office";
};

const unitArea = x => parseFloat(String(L(x.dims)).match(/([\d.,]+)\s*m²/)[1].replace(",", "."));

/* ---------- comportamento depois de cada página ---------- */
let rtTimer = null, rtStart = null;
function enhance(key){
  clearInterval(rtTimer); clearTimeout(rtStart); rtTimer = null;
  app.className = key === "work" ? "tone-b" : "tone-y";
  if (window.R2scenes) window.R2scenes(app);
  const reduceM = reduce();

  /* “Room to…” na homepage */
  const block = document.getElementById("wordBlock");
  if (block){
    const word = document.getElementById("word"), measure = document.getElementById("wordMeasure"), toggle = document.getElementById("motionToggle"),
      icoPause = document.getElementById("icoPause"), icoPlay = document.getElementById("icoPlay");
    const words = [["store.",""],["stock up.",""],["work.","is-b"],["meet.","is-b"],["grow.","is-k"]];
    let i = 0, paused = false;
    const widthFor = s => { measure.textContent = s; return measure.getBoundingClientRect().width; };
    const fit = () => { if (document.body.contains(block)) block.style.width = Math.ceil(widthFor(word.textContent)) + "px"; };
    const next = () => {
      i = (i + 1) % words.length; const w = words[i];
      word.classList.add("out");
      setTimeout(() => {
        word.textContent = w[0]; block.classList.remove("is-b", "is-k"); if (w[1]) block.classList.add(w[1]);
        block.style.width = Math.ceil(widthFor(w[0])) + "px";
        word.classList.remove("out"); word.classList.add("pre"); void word.offsetWidth; word.classList.remove("pre");
      }, 380);
    };
    const start = () => { if (!rtTimer) rtTimer = setInterval(next, 2400); };
    const stop = () => { clearInterval(rtTimer); rtTimer = null; };
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => {
      fit(); if (!reduceM) rtStart = setTimeout(() => { if (!paused && document.body.contains(block)){ next(); start(); } }, 1700);
    });
    window.addEventListener("resize", fit);
    toggle.addEventListener("click", () => {
      paused = !paused; if (paused) stop(); else { next(); start(); }
      toggle.setAttribute("aria-label", paused ? X("Retomar animação", "Resume animation") : X("Pausar animação", "Pause animation"));
      icoPause.hidden = paused; icoPlay.hidden = !paused;
    });
  }

  /* Como funciona: separadores ligados ao telemóvel */
  const tabs = [...app.querySelectorAll('#como-funciona [role="tab"]')];
  if (tabs.length){
    const panels = tabs.map(tb => document.getElementById(tb.getAttribute("aria-controls")));
    const sel = (n, focus) => { tabs.forEach((tb, k) => { const on = k === n; tb.setAttribute("aria-selected", String(on)); tb.tabIndex = on ? 0 : -1;
      panels[k].classList.toggle("on", on); panels[k].setAttribute("aria-hidden", String(!on)); panels[k].inert = !on; }); if (focus) tabs[n].focus(); };
    tabs.forEach((tb, n) => {
      tb.addEventListener("click", () => sel(n));
      tb.addEventListener("keydown", e => {
        if (e.key === "ArrowDown" || e.key === "ArrowRight"){ e.preventDefault(); sel((n + 1) % tabs.length, true); }
        if (e.key === "ArrowUp" || e.key === "ArrowLeft"){ e.preventDefault(); sel((n + tabs.length - 1) % tabs.length, true); }
      });
    });
    sel(0);
    const door = document.getElementById("doorBtn"), lab = document.getElementById("doorLabel"), st = document.getElementById("doorStatus"); let busy = false;
    door.addEventListener("click", () => {
      if (busy) return; busy = true; lab.textContent = X("A abrir…", "Opening…");
      setTimeout(() => { door.classList.add("open"); lab.textContent = X("Porta aberta", "Door open"); st.textContent = X("Porta aberta.", "Door open."); }, 700);
      setTimeout(() => { door.classList.remove("open"); lab.textContent = X("Abrir porta", "Open door"); st.textContent = ""; busy = false; }, 3200);
    });
  }

  /* Galeria: progresso e estado das setas */
  const rail = document.getElementById("gal"), bar = document.getElementById("galBar");
  if (rail && bar){
    const prevB = app.querySelector('[data-slide="-1"]'), nextB = app.querySelector('[data-slide="1"]');
    const upd = () => { const max = rail.scrollWidth - rail.clientWidth, vis = Math.min(1, rail.clientWidth / rail.scrollWidth), f = max > 0 ? rail.scrollLeft / max : 0;
      bar.style.width = (vis * 100) + "%"; bar.style.transform = "translateX(" + (f * (1 / vis - 1) * 100) + "%)";
      if (prevB) prevB.disabled = rail.scrollLeft < 4; if (nextB) nextB.disabled = rail.scrollLeft > max - 4; };
    rail.addEventListener("scroll", upd, { passive:true }); window.addEventListener("resize", upd); upd();
    rail.addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === "ArrowLeft"){ e.preventDefault(); rail.scrollBy({ left:(e.key === "ArrowRight" ? 1 : -1) * rail.clientWidth * .7, behavior: reduceM ? "auto" : "smooth" }); } });
  }
  /* Guia de tamanhos */
  const sg = document.getElementById("sguide");
  if (sg){
    sg.addEventListener("change", e => {
      const v = e.target.value, x = TYPES.find(y => typeName(y) === v); if (!x) return;
      sg.querySelectorAll(".sg-b").forEach(b => b.classList.toggle("on", b.dataset.unit === v));
      app.querySelectorAll(".card.unit").forEach(c => c.classList.toggle("is-match", c.dataset.unit === v));
      document.getElementById("sgOut").innerHTML = `<p class="sg-res"><b>${esc(v)}</b>, ${fmtArea(unitArea(x))} m²</p><p class="body">${esc(L(x.use))}.</p>
        <div class="btn-row" style="margin-top:14px">${ext("unit", esc(t("book_unit")), "btn btn-solid btn-sm", v)}<a class="link" href="${href("storage")}" data-scroll='.card.unit[data-unit="${esc(v)}"]'>${X("Ver detalhes", "See details")}</a></div>`;
    });
  }
  /* Direção de fotografia (rótulo na língua da página) */
  const pdL = document.getElementById("pdLabel"); if (pdL) pdL.textContent = X("Direção de fotografia", "Photo direction");
}

        <div><h2 class="f-h">${esc(t("f_contact"))}</h2>
          <address class="f-addr">
            <span><span class="k">${esc(t("d_address"))}</span>Rua das Pombas, Zona Industrial de Taboeira<br>3800-055 Aveiro, Portugal</span>
            <span><span class="k">${esc(t("d_phone"))}</span>+351 [000 000 000]<br><small>${esc(t("d_call"))}</small></span>
            <span><span class="k">${esc(t("d_email"))}</span>[email]@room2.pt</span>
          </address></div>
        <div><h2 class="f-h" id="fh-follow">${esc(t("f_follow"))}</h2>
          <ul class="f-list" aria-labelledby="fh-follow">${["Instagram", "LinkedIn", "Facebook"].map(n => `<li>${ext("social", `${n} ${I.ext}`, "", n)}</li>`).join("")}</ul></div>
      </div>
    </div>
    <div class="f-bottom">
      <span class="f-copy">${esc(t("copy"))}</span>
      <div class="f-legal">
        <a href="${href("terms")}">${esc(t("terms"))}</a><a href="${href("privacy")}">${esc(t("privacy"))}</a><a href="${href("cookies")}">${esc(t("cookies"))}</a>
        ${ext("complaints", `${esc(t("complaints"))} ${I.ext}`)}${ext("ral", `${esc(t("ral"))} ${I.ext}`)}
      </div>
      <div class="f-right">
        <button type="button" id="backTop">${esc(t("back_top"))} ${I.up}</button>
        <a class="f-loba" href="https://www.loba.com/" target="_blank" rel="noopener" title="LOBA" aria-label="${esc(t("developed_aria"))}"><span class="f-loba-txt" aria-hidden="true">${esc(t("developed"))}</span><span class="f-loba-mark" aria-hidden="true"></span></a>
      </div>
    </div></div>`;
  const sk = document.querySelector("[data-skip]"); sk.textContent = t("skip");
}

/* ================= router ================= */
const app = document.getElementById("app");
let prev = { key:undefined, lang:undefined };
function route(){
  let raw = location.hash.replace(/^#/, "") || "/";
  if (raw[0] !== "/"){ const tp = "/" + raw.replace(/\./g, "/"); if (/^[a-z0-9.-]+$/.test(raw) && resolve(tp).key) raw = tp; else return; }
  let path = raw.split("?")[0];
  if (path.length > 1 && path.endsWith("/")) path = path.slice(0, -1);
  const r = resolve(path);
  lang = r.lang;
  document.documentElement.lang = lang === "pt" ? "pt-PT" : "en";
  const key = r.key;
  let html;
  if (key === "home") html = V.home();
  else if (key === "storage" || key === "work") html = V.service(key);
  else if (key === "about") html = V.about();
  else if (key === "support") html = V.support();
  else if (key === "contact") html = V.contact();
  else if (key === "privacy" || key === "cookies" || key === "terms") html = V.legal(key);
  else html = V.notFound();
  const langOnly = prev.key === key && prev.lang !== lang;
  renderChrome(key);
  app.innerHTML = html;
  enhance(key);
  const seo = key && SEO[key];
  document.title = seo ? L(seo.title) : t("nf_title") + " | ROOM2";
  const md = document.querySelector('meta[name="description"]');
  if (md && seo && seo.desc) md.setAttribute("content", L(seo.desc));
  closeMenu(false);
  if (!cookieEl.hidden) renderCookie();
  if (!langOnly){
    window.scrollTo(0, 0);
    if (prev.key !== undefined){ const f = app.querySelector("[data-focus]"); if (f){ f.setAttribute("tabindex", "-1"); f.focus({ preventScroll:true }); } }
  }
  prev = { key, lang };
}
window.addEventListener("hashchange", route);

/* ================= interactions ================= */
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const xdlg = document.getElementById("xdlg");
let xOpener = null;
function openExt(a){
  const type = a.dataset.ext, name = a.dataset.name || "";
  let target, url, note, same = true;
  if (type === "book"){ target = t("x_book"); url = t("x_book_url"); note = t("x_book_note"); }
  else if (type === "unit"){ target = t("x_unit").replace("{name}", name); url = t("x_unit_url").replace("{name}", name); note = t("x_unit_note"); }
  else if (type === "account"){ target = t("x_account"); url = t("x_account_url"); note = t("x_account_note"); }
  else if (type === "social"){ target = name; url = t("x_social_url").replace("{name}", name); note = t("x_social_note"); same = false; }
  else if (type === "complaints"){ target = t("complaints"); url = t("x_complaints_url"); note = t("x_legal_note"); same = false; }
  else { target = t("ral"); url = t("x_ral_url"); note = t("x_legal_note"); same = false; }
  xdlg.innerHTML = `<div class="bar" style="display:flex;align-items:center;justify-content:space-between;gap:12px"><p class="kicker" id="xdTitle">${esc(t("x_title"))}</p><button class="icon-btn" type="button" data-xclose aria-label="${esc(t("x_close"))}">${I.close}</button></div>
    <div class="in"><p class="target">${esc(target)}</p><p class="url">${esc(url)}</p>
    <p class="note">${esc(note)} ${esc(same ? t("x_same") : t("x_new"))}</p>
    ${type === "book" || type === "unit" ? `<p class="note" style="display:flex;gap:10px">${I.info}<span>${esc(t("booking_notice"))}</span></p>` : ""}
    <div><button class="btn btn-solid btn-sm" type="button" data-xclose>${esc(t("x_close"))}</button></div></div>`;
  xOpener = a;
  if (typeof xdlg.showModal === "function") xdlg.showModal(); else xdlg.setAttribute("open", "");
}
const closeX = () => { if (typeof xdlg.close === "function") xdlg.close(); else { xdlg.removeAttribute("open"); if (xOpener) xOpener.focus(); } };
xdlg.addEventListener("close", () => { if (xOpener && document.contains(xOpener)) xOpener.focus(); });
xdlg.addEventListener("click", e => { if (e.target === xdlg || e.target.closest("[data-xclose]")) closeX(); });

/* modo “Direção de fotografia”: mostra o briefing de cada imagem */
const pdT = document.getElementById("pdToggle");
pdT.addEventListener("click", () => { const on = document.documentElement.classList.toggle("ph-mode"); pdT.setAttribute("aria-pressed", String(on)); });

/* mobile menu, with focus kept inside while open */
const panel = document.getElementById("menuPanel");
function openMenu(){ panel.hidden = false; const b = document.getElementById("menuOpen"); if (b) b.setAttribute("aria-expanded", "true"); document.body.style.overflow = "hidden"; const c = document.getElementById("menuClose"); if (c) c.focus(); }
function closeMenu(restore){ if (panel.hidden) return; panel.hidden = true; document.body.style.overflow = ""; const b = document.getElementById("menuOpen"); if (b){ b.setAttribute("aria-expanded", "false"); if (restore) b.focus(); } }
panel.addEventListener("keydown", e => {
  if (e.key === "Escape"){ closeMenu(true); return; }
  if (e.key !== "Tab") return;
  const f = [...panel.querySelectorAll("a,button")].filter(x => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});
window.addEventListener("resize", () => { if (window.innerWidth > 1060) closeMenu(false); });

document.addEventListener("click", e => {
  const x = e.target.closest("[data-ext]");
  if (x){ e.preventDefault(); if (!panel.hidden) closeMenu(false); openExt(x); return; }
  if (e.target.closest("#menuOpen")){ openMenu(); return; }
  if (e.target.closest("#menuClose")){ closeMenu(true); return; }
  const sk = e.target.closest("[data-skip]");
  if (sk){ e.preventDefault(); app.focus(); return; }
  const sc = e.target.closest("[data-scroll]");
  if (sc){
    e.preventDefault();
    const el = document.querySelector(sc.dataset.scroll);
    if (el){ el.scrollIntoView({ behavior: reduce() ? "auto" : "smooth" }); const h = el.querySelector("h2"); if (h){ h.setAttribute("tabindex", "-1"); h.focus({ preventScroll:true }); } }
    return;
  }
  const sl = e.target.closest("[data-slide]");
  if (sl){
    const g = document.getElementById("gal"); if (!g) return;
    const first = g.firstElementChild, step = first ? first.getBoundingClientRect().width + 16 : 300;
    g.scrollBy({ left: step * Number(sl.dataset.slide), behavior: reduce() ? "auto" : "smooth" });
    return;
  }
  if (e.target.closest("#backTop")){ window.scrollTo({ top:0, behavior: reduce() ? "auto" : "smooth" }); const f = app.querySelector("[data-focus]"); if (f){ f.setAttribute("tabindex", "-1"); f.focus({ preventScroll:true }); } return; }
  if (e.target.closest("[data-cookie-open]")){ showCookie(true); return; }
  if (e.target.closest("[data-maps-ok]")){ consent = Object.assign({ analytics:false }, consent || {}, { maps:true }); refreshMap(); hideCookie(); return; }
  if (e.target.closest("#again")){
    const form = document.getElementById("cform"), sent = document.getElementById("sent");
    form.reset(); form.hidden = false; sent.hidden = true; document.getElementById("f-name").focus(); return;
  }
});

/* contact form: inline validation and inline success message (section 9.9) */
function setErr(el, id, bad){ el.setAttribute("aria-invalid", bad ? "true" : "false"); document.getElementById(id).hidden = !bad; }
document.addEventListener("input", e => {
  const el = e.target; if (el.getAttribute("aria-invalid") !== "true") return;
  const id = el.getAttribute("aria-describedby"); if (!id) return;
  const ok = el.type === "checkbox" ? el.checked : el.type === "email" ? /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.value.trim()) : el.value.trim().length > 0;
  if (ok) setErr(el, id, false);
});
document.addEventListener("change", e => { if (e.target.id === "f-subject" || e.target.id === "f-consent") e.target.dispatchEvent(new Event("input", { bubbles:true })); });
document.addEventListener("submit", e => {
  if (e.target.id !== "cform") return;
  e.preventDefault();
  const f = e.target, $ = s => f.querySelector(s);
  const name = $("#f-name"), email = $("#f-email"), subj = $("#f-subject"), msg = $("#f-msg"), ok = $("#f-consent");
  setErr(name, "e-name", !name.value.trim());
  setErr(email, "e-email", !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim()));
  setErr(subj, "e-subject", !subj.value);
  setErr(msg, "e-msg", !msg.value.trim());
  setErr(ok, "e-consent", !ok.checked);
  const bad = f.querySelector('[aria-invalid="true"]');
  if (bad){ bad.focus(); return; }
  const sent = document.getElementById("sent");
  sent.innerHTML = `<p class="h2" tabindex="-1" style="font-size:24px">${esc(t("sent"))}</p><div><button class="btn btn-line" type="button" id="again">${esc(t("again"))}</button></div>`;
  sent.hidden = false; f.hidden = true; sent.querySelector("p").focus();
});

/* cookies (CMP, in memory): Accept, Reject and Choose with equal visual weight (section 12.4) */
const cookieEl = document.getElementById("cookie");
let consent = null, ckOpen = false;
function renderCookie(){
  cookieEl.setAttribute("aria-label", t("ck_region"));
  cookieEl.innerHTML = `<p>${esc(t("ck_text"))} <a href="${href("cookies")}">${esc(t("ck_policy"))}</a>.</p>
    <div class="opts" id="ckOpts" ${ckOpen ? "" : "hidden"}>
      <label class="check"><input type="checkbox" checked disabled> <span>${esc(t("ck_ess"))}</span></label>
      <label class="check"><input type="checkbox" id="ckAn" ${consent && consent.analytics ? "checked" : ""}> <span>${esc(t("ck_an"))}</span></label>
      <label class="check"><input type="checkbox" id="ckMaps" ${consent && consent.maps ? "checked" : ""}> <span>${esc(t("ck_maps"))}</span></label>
      <button class="btn btn-line btn-sm" type="button" data-ck="save" style="align-self:flex-start">${esc(t("ck_save"))}</button>
    </div>
    <div class="row">
      <button class="btn btn-line" type="button" data-ck="all">${esc(t("ck_accept"))}</button>
      <button class="btn btn-line" type="button" data-ck="none">${esc(t("ck_reject"))}</button>
      <button class="btn btn-line" type="button" data-ck="choose" aria-expanded="${ckOpen}" aria-controls="ckOpts">${esc(ckOpen ? t("ck_hide") : t("ck_choose"))}</button>
    </div>`;
}
function showCookie(open){
  ckOpen = !!open; renderCookie(); cookieEl.hidden = false;
  requestAnimationFrame(() => { const h = cookieEl.offsetHeight + 40; document.documentElement.style.scrollPaddingBottom = h + "px"; document.body.style.paddingBottom = h + "px"; });
  if (open){ const b = cookieEl.querySelector("#ckAn"); if (b) b.focus(); }
}
function hideCookie(){ cookieEl.hidden = true; document.documentElement.style.scrollPaddingBottom = ""; document.body.style.paddingBottom = ""; }
function refreshMap(){ const m = document.getElementById("mapbox"); if (m) m.outerHTML = mapBox(); }
cookieEl.addEventListener("click", e => {
  const b = e.target.closest("[data-ck]"); if (!b) return;
  const k = b.dataset.ck;
  if (k === "choose"){ ckOpen = !ckOpen; renderCookie(); showCookie(ckOpen); cookieEl.querySelector('[data-ck="choose"]').focus(); return; }
  if (k === "all") consent = { analytics:true, maps:true };
  else if (k === "none") consent = { analytics:false, maps:false };
  else consent = { analytics: cookieEl.querySelector("#ckAn").checked, maps: cookieEl.querySelector("#ckMaps").checked };
  hideCookie(); refreshMap();
});

/* ================= start ================= */
route(); showCookie(false);
})();
</script>
