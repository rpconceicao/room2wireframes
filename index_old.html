<style>
/* ================= tokens: zinc wireframe, dark base with light bands (as in the reference) ================= */
:root{
  color-scheme: dark;
  --bg:#09090b; --band:#111113; --surface:#18181b; --surface-2:#27272a; --border:#27272a; --border-2:#3f3f46;
  --fg:#fafafa; --fg2:#d4d4d8; --muted:#a1a1aa; --faint:#93939c;
  --btn-bg:#fafafa; --btn-fg:#18181b; --btn-hover:#e4e4e7;
  --ph-fill:#141416; --ph-line:#2a2a2e; --ph-border:#3f3f46; --ph-tag:#18181b;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --max:1280px; --pad:24px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme: dark; } }
.light{
  color-scheme: light;
  --bg:#fafafa; --band:#f4f4f5; --surface:#ffffff; --surface-2:#f4f4f5; --border:#e4e4e7; --border-2:#d4d4d8;
  --fg:#18181b; --fg2:#52525b; --muted:#5f5f68; --faint:#63636b;
  --btn-bg:#18181b; --btn-fg:#ffffff; --btn-hover:#3f3f46;
  --ph-fill:#f4f4f5; --ph-line:#e4e4e7; --ph-border:#d4d4d8; --ph-tag:#ffffff;
  background:var(--bg); color:var(--fg);
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--fg)} a:hover{color:var(--muted)}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}
button{font-family:inherit}
h1,h2,h3,p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:300;background:var(--fg);color:var(--bg);padding:12px 18px;text-decoration:none;font-size:13px;border-radius:8px}
.skip:focus{top:12px}
.wrap{max-width:var(--max);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
#app{overflow-x:clip}
#app > section{border-bottom:1px solid var(--border)}

/* ================= type ================= */
.kicker{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--faint)}
.display{font-weight:500;letter-spacing:-.035em;line-height:.98;color:var(--fg)}
.h2{font-size:28px;font-weight:500;letter-spacing:-.015em;line-height:1.2;color:var(--fg)}
.h3{font-size:17px;font-weight:600;line-height:1.35;color:var(--fg)}
.lead{font-size:17px;line-height:1.65;color:var(--fg2);max-width:40rem}
.body{font-size:15px;line-height:1.7;color:var(--muted)}
.meta{font-size:12px;color:var(--faint)}
.note{font-size:13px;line-height:1.55;color:var(--muted)}
.link{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;text-decoration:none;padding:10px 0;color:var(--fg);white-space:nowrap}
.link:hover{color:var(--muted)}
.ext-ico{flex-shrink:0;opacity:.7}

/* ================= buttons ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:background-color .15s,color .15s,border-color .15s;white-space:nowrap}
.btn-solid{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.btn-solid:hover{background:var(--btn-hover);color:var(--btn-fg)}
.btn-line{background:transparent;color:var(--fg);border-color:var(--border-2)}
.btn-line:hover{background:var(--surface-2);color:var(--fg)}
.btn-sm{min-height:40px;padding:0 16px;font-size:13px}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* ================= image placeholders ================= */
.ph{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;overflow:hidden;
  background:linear-gradient(to top right,transparent calc(50% - .5px),var(--ph-line) calc(50% - .5px),var(--ph-line) calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(to top left,transparent calc(50% - .5px),var(--ph-line) calc(50% - .5px),var(--ph-line) calc(50% + .5px),transparent calc(50% + .5px)),var(--ph-fill);
  border:1px dashed var(--ph-border);border-radius:12px;color:var(--faint);text-align:center}
.ph-tag{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--ph-border);border-radius:8px;background:var(--ph-tag);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ph-cap{max-width:28ch;font-size:12px;line-height:1.45;color:var(--faint);background:var(--ph-tag);padding:2px 8px;border-radius:6px}
.ph svg{flex-shrink:0}
.r-43{aspect-ratio:4/3}.r-32{aspect-ratio:3/2}.r-11{aspect-ratio:1/1}.r-45{aspect-ratio:4/5}.r-169{aspect-ratio:16/9}
/* angular mask derived from the logo symbol (design to define the exact shape) */
.mask-a{clip-path:polygon(0 0,100% 0,100% calc(100% - 56px),calc(100% - 56px) 100%,0 100%)}
.mask-b{clip-path:polygon(56px 0,100% 0,100% 100%,0 100%,0 56px)}
.angle{display:block;width:44px;height:22px;background:var(--border-2);clip-path:polygon(0 0,50% 100%,100% 0,78% 0,50% 56%,22% 0)}

/* ================= password gate ================= */
body.locked > :not(.gate):not(script){display:none !important}
.gate{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);overflow:auto}
.gate .ph{position:absolute;inset:0;border:0;border-radius:0;opacity:.6}
.gate form{position:relative;width:100%;max-width:448px;display:flex;flex-direction:column;gap:20px;background:var(--surface);border:1px solid var(--border-2);border-radius:16px;padding:32px;box-shadow:0 25px 50px -12px #000000aa}
.gate .logo{font-size:30px}
.gate .sig{margin-top:-14px}
.gate .pw{display:flex;align-items:center;border:1px solid var(--border-2);border-radius:8px;padding:0 6px 0 14px;background:var(--bg)}
.gate .pw:focus-within{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.gate .pw:has(input[aria-invalid="true"]){border:2px solid var(--fg)}
.gate .pw input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:14px;min-height:42px;outline:none}
.gate .show{background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;min-height:40px;padding:0 8px}
.gate .btn{width:100%}
.gate .shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){ .gate .shake{animation:none} }

/* ================= header ================= */
.site-header{position:sticky;top:0;z-index:60;background:rgba(9,9,11,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:61;background:rgba(9,9,11,.9);backdrop-filter:blur(8px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:64px}
.brand{display:inline-flex;align-items:center;gap:14px;text-decoration:none;min-height:44px}
.logo{font-size:22px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--fg);text-transform:lowercase}
.sig{font-size:12px;color:var(--faint);padding-left:14px;border-left:1px solid var(--border-2);white-space:nowrap}
.nav{display:flex;align-items:center;gap:2px}
.nav a{font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:8px}
.nav a:hover{color:var(--fg)}
.nav a[aria-current="page"]{color:var(--fg);background:var(--surface-2)}
.actions{display:flex;align-items:center;gap:14px}
.acct{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;min-height:44px}
.acct:hover{color:var(--fg)}
.lang{display:inline-flex;align-items:center;gap:0}
.lang a{display:inline-flex;align-items:center;justify-content:center;min-width:34px;min-height:44px;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);text-decoration:none}
.lang a[aria-current="true"]{color:var(--fg);text-decoration:underline;text-underline-offset:6px}
.lang a:hover{color:var(--fg)}
.lang .sep{color:var(--border-2);font-size:12px}
.menu-btn{display:none;align-items:center;gap:10px;min-height:44px;padding:0 4px;background:none;border:0;color:var(--fg2);font-size:13px;font-weight:600;cursor:pointer}
.menu-btn .lines{display:inline-flex;flex-direction:column;gap:5px}
.menu-btn .lines i{display:block;width:20px;height:1.5px;background:currentColor}
@media (max-width:1240px){ .brand .sig{display:none} }
@media (max-width:1060px){ .nav,.actions .acct,.actions .lang{display:none} .menu-btn{display:inline-flex} }
@media (max-width:380px){ .actions{gap:8px} .actions .btn-sm{padding:0 12px} }

/* mobile menu */
.menu-panel{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) var(--pad) calc(env(safe-area-inset-bottom,0px) + 24px)}
.menu-panel[hidden]{display:none}
.menu-panel .top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px}
.menu-panel nav{display:flex;flex-direction:column;margin-top:20px}
.menu-panel nav a{font-size:17px;font-weight:500;color:var(--fg2);text-decoration:none;padding:15px 12px;border-bottom:1px solid var(--border)}
.menu-panel nav a[aria-current="page"]{color:var(--fg);background:var(--surface)}
.menu-panel .acct{padding:0 12px;margin-top:12px;font-size:15px}
.menu-panel .lang{margin:8px 0 0 4px}
.menu-panel .lang a{font-size:14px;min-width:44px}
.menu-panel .foot{margin-top:auto;padding-top:28px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;background:none;border:0;color:var(--fg);cursor:pointer;border-radius:8px}
.icon-btn:hover{background:var(--surface-2)}

/* ================= hero (homepage) ================= */
.hero{position:relative;isolation:isolate;min-height:max(580px,82svh);display:flex;align-items:flex-end;overflow:hidden}
.hero > .ph{position:absolute;inset:0;border:0;border-radius:0;z-index:-1;justify-content:flex-start;padding-top:12%}
.hero-in{width:100%;padding-top:120px;padding-bottom:64px;display:flex;flex-direction:column;gap:18px}
.hero .display{font-size:clamp(64px,12vw,168px)}
.hero h1{font-size:clamp(20px,2.2vw,28px);font-weight:500;letter-spacing:-.015em;line-height:1.3;color:var(--fg);max-width:34rem}
.hero .lead{margin-top:-8px}
.hero .btn-row{margin-top:10px}
.hero-card{display:flex;flex-direction:column;gap:18px;max-width:46rem;background:rgba(9,9,11,.78);border:1px solid var(--border);border-radius:16px;padding:28px 28px 30px}
@media (max-width:600px){ .hero-card{padding:22px} .hero-in{padding-bottom:28px} }

/* ================= page heads (inner pages) ================= */
.page-head{position:relative;isolation:isolate;background:var(--band);border-bottom:1px solid var(--border)}
.page-head .wrap{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:40px 56px;align-items:end;padding-top:64px;padding-bottom:64px}
.page-head .txt{display:flex;flex-direction:column;gap:16px;min-width:0}
.page-head .display{font-size:clamp(48px,8vw,108px)}
.page-head h1{font-size:clamp(20px,2.2vw,26px);font-weight:500;letter-spacing:-.015em;line-height:1.3;color:var(--fg);max-width:34rem}
.page-head h1.solo{font-size:clamp(36px,5vw,56px);letter-spacing:-.03em;line-height:1.08}
.page-head .btn-row{margin-top:8px}
.page-head .ph{width:100%}
@media (max-width:900px){ .page-head .wrap{grid-template-columns:1fr;padding-top:44px;padding-bottom:44px} }

/* ================= sections ================= */
.sec{padding-top:72px;padding-bottom:72px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;margin-bottom:32px}
.sec-head .txt{display:flex;flex-direction:column;gap:10px;max-width:44rem}
.band{background:var(--band)}
.grid{display:grid;gap:20px;list-style:none;margin:0;padding:0}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){ .g-4,.g-5{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){ .g-3{grid-template-columns:1fr} .g-2{grid-template-columns:1fr} }
@media (max-width:560px){ .g-4,.g-5{grid-template-columns:1fr} }
.card{display:flex;flex-direction:column;gap:10px;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:22px;min-width:0}
a.card{text-decoration:none;transition:border-color .15s}
a.card:hover{border-color:var(--fg);color:var(--fg)}
.ico{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px dashed var(--ph-border);border-radius:10px;color:var(--faint);margin-bottom:6px}

/* need selector */
.selector{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.vgroup{border:1px solid var(--border);border-radius:16px;background:var(--band);padding:20px;display:flex;flex-direction:column;gap:16px}
.vgroup-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 4px}
.vgroup-head .h3{font-size:15px}
.vcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.need{display:flex;flex-direction:column;gap:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden;text-decoration:none;color:var(--fg);transition:border-color .15s}
.need:hover{border-color:var(--fg);color:var(--fg)}
.need .ph{border-width:0 0 1px;border-style:solid;border-color:var(--border);border-radius:0}
.need .in{display:flex;flex-direction:column;gap:8px;padding:2px 18px 20px}
.need .term{font-size:22px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.need .go{display:inline-flex;align-items:center;gap:8px;margin-top:auto;padding:0 18px 18px;font-size:13px;font-weight:600}
@media (max-width:1000px){ .selector{grid-template-columns:1fr} }
@media (max-width:520px){ .vcards{grid-template-columns:1fr} }

/* moment (brand line) */
.moment{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;padding:88px 24px}
.moment blockquote{margin:0;max-width:20em;font-size:clamp(28px,4vw,48px);font-weight:500;letter-spacing:-.03em;line-height:1.15;color:var(--fg)}

/* typology cards (CMS) */
.unit{padding:0;overflow:hidden;gap:0}
.unit .ph{border-width:0 0 1px;border-style:solid;border-color:var(--border);border-radius:0}
.unit .in{display:flex;flex-direction:column;gap:10px;padding:18px 20px 20px;flex:1}
.tag{align-self:flex-start;font-size:11px;font-weight:600;color:var(--fg2);background:var(--surface-2);border:1px solid var(--border-2);border-radius:999px;padding:3px 10px}
.unit .name{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.2;color:var(--fg)}
.facts{margin:0;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);padding-top:12px}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts dt{font-size:11px;font-weight:600;color:var(--faint)}
.facts dd{margin:0;font-size:14px;line-height:1.45;color:var(--fg2)}
.unit .btn{margin-top:auto;width:100%}
.unit .btn-wrap{margin-top:auto;padding-top:8px}
.tip{display:flex;gap:12px;align-items:flex-start;margin-top:20px;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--band);font-size:14px;color:var(--fg2)}

/* price table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:560px;font-size:14px}
th,td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--faint);background:var(--band)}
tbody tr:last-child td{border-bottom:0}
td.num{white-space:nowrap;font-weight:600;color:var(--fg)}
table .sub{display:block;font-size:12px;color:var(--faint);margin-top:2px}

/* benefits split */
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:860px){ .split{grid-template-columns:1fr} }
.checks{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.checks li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--border);font-size:14px;line-height:1.55;color:var(--fg2)}
.checks li:first-child{border-top:0}
.checks svg{flex-shrink:0;margin-top:3px;color:var(--fg)}

/* CTA band */
.cta{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:72px 24px;background:var(--band)}
.cta .h2{max-width:22em}
.cta .body{max-width:34rem}
.cta .btn-row{justify-content:center;margin-top:8px}
.cta .handoff{display:inline-flex;align-items:center;gap:8px;margin-top:4px}

/* cross sell */
.xsell{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface)}
.xsell .ph{border-width:0 1px 0 0;border-style:solid;border-color:var(--border);border-radius:0;min-height:280px}
.xsell .in{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:40px}
.xsell .display{font-size:clamp(36px,4.6vw,60px)}
@media (max-width:820px){ .xsell{grid-template-columns:1fr} .xsell .ph{border-width:0 0 1px;min-height:200px} .xsell .in{padding:28px} }

/* gallery slider */
.slider{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,32%);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:thin}
.slider > *{scroll-snap-align:start}
@media (max-width:700px){ .slider{grid-auto-columns:82%} }
.slide-nav{display:flex;gap:8px}

/* FAQ */
.faq-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:40px}
.faq-nav a{font-size:13px;font-weight:500;text-decoration:none;color:var(--fg2);border:1px solid var(--border-2);border-radius:999px;padding:8px 14px;min-height:40px;display:inline-flex;align-items:center}
.faq-nav a:hover{background:var(--surface-2);color:var(--fg)}
.faq-cat{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:16px 48px;padding:40px 0;border-top:1px solid var(--border)}
.faq-cat:first-of-type{border-top:0;padding-top:0}
.faq-cat .h2{font-size:22px}
@media (max-width:860px){ .faq-cat{grid-template-columns:1fr} }
.faq-list{display:flex;flex-direction:column;gap:10px}
details{border:1px solid var(--border);border-radius:12px;background:var(--surface)}
details[open]{border-color:var(--border-2)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 18px;font-size:15px;font-weight:600;color:var(--fg);min-height:52px}
summary::-webkit-details-marker{display:none}
summary .pm{flex-shrink:0;transition:transform .2s}
details[open] summary .pm{transform:rotate(45deg)}
@media (prefers-reduced-motion:reduce){ summary .pm{transition:none} }
details .ans{padding:0 18px 18px;font-size:14px;line-height:1.7;color:var(--fg2);max-width:46rem}
details .ans p + p{margin-top:8px}

/* forms */
.form{display:flex;flex-direction:column;gap:22px}
.row-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:22px 20px}
.field{display:flex;flex-direction:column;gap:8px}
.field > label:not(.check){font-size:12px;font-weight:600;color:var(--fg2)}
.req{font-size:11px;font-weight:400;color:var(--faint);margin-left:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;font-size:14px;padding:10px 14px;min-height:44px}
.field textarea{resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--fg);outline:2px solid var(--fg);outline-offset:0}
.field [aria-invalid="true"]{border-color:var(--fg);border-width:2px}
.err{font-size:12px;font-weight:500;color:var(--fg)} .err::before{content:"! ";font-weight:700}
.err[hidden]{display:none}
.check{display:flex;align-items:flex-start;gap:12px;font-size:13px;line-height:1.6;color:var(--muted);cursor:pointer}
.check input{flex:0 0 18px;width:18px;height:18px;min-height:0;padding:0;margin:2px 0 0;accent-color:var(--fg)}
.contact-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:48px 64px;align-items:start}
@media (max-width:900px){ .contact-grid{grid-template-columns:1fr} }
.dl{margin:0;display:flex;flex-direction:column;gap:12px}
.dl > div{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--surface)}
.dl dt{font-size:11px;font-weight:600;color:var(--faint);margin-bottom:4px}
.dl dd{margin:0;font-size:14px;line-height:1.6;color:var(--fg2)}
.dl dd small{display:block;font-size:12px;color:var(--faint)}
.sent{display:flex;flex-direction:column;gap:16px;padding:28px;border:1px solid var(--border-2);border-radius:12px;background:var(--surface)}
.sent[hidden]{display:none}
.mapbox{position:relative}
.mapbox .ph{min-height:280px}
.map-gate{position:absolute;inset:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;background:var(--surface);border:1px solid var(--border-2);border-radius:10px}
.map-gate[hidden]{display:none}

/* legal */
.legal{max-width:46rem;display:flex;flex-direction:column}
.legal section{border-top:1px solid var(--border);padding:28px 0;display:flex;flex-direction:column;gap:10px}
.legal section:first-child{border-top:0;padding-top:0}
.legal h2{font-size:17px;font-weight:600;color:var(--fg)}
.legal p{font-size:14px;line-height:1.75;color:var(--fg2)}

/* 404 */
.nf{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:40px 56px;align-items:center;padding-top:80px;padding-bottom:96px}
.nf .txt{display:flex;flex-direction:column;gap:18px}
.nf h1{font-size:clamp(40px,6vw,72px);font-weight:500;letter-spacing:-.035em;line-height:1.02}
@media (max-width:860px){ .nf{grid-template-columns:1fr;padding-top:48px} }

/* ================= footer ================= */
.site-footer{background:var(--band);border-top:1px solid var(--border);color:var(--muted)}
.nl{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px 72px;align-items:end;padding-top:48px;padding-bottom:48px;border-bottom:1px solid var(--border)}
.nl-txt{display:flex;flex-direction:column;gap:12px}
.nl-form{display:flex;flex-direction:column;gap:12px}
.nl-form[hidden]{display:none}
.nl-row{display:flex;gap:12px;align-items:flex-end}
.nl-ok{font-size:18px;font-weight:500;color:var(--fg);padding:16px;border:1px solid var(--border-2);border-radius:12px;margin:0}
.nl-ok[hidden]{display:none}
.wf-note{display:block;align-self:flex-start;max-width:34rem;margin:0 0 4px;font-size:10.5px;line-height:1.45;color:var(--faint);border-left:2px dashed var(--border-2);padding:2px 0 2px 8px;opacity:.85}
.wf-tag{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:6px}
@media (max-width:900px){ .nl{grid-template-columns:1fr} }
@media (max-width:520px){ .nl-row{flex-direction:column;align-items:stretch} }
.f-top{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px 72px;padding-top:56px;padding-bottom:48px}
.f-brand{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.f-brand .logo{font-size:30px}
.f-claim{font-size:22px;font-weight:500;letter-spacing:-.02em;line-height:1.25;color:var(--fg);margin-top:6px}
.f-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 28px}
.f-h{margin:0 0 12px;font-size:15px;font-weight:700;letter-spacing:-.005em;color:var(--fg)}
.f-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.f-list a{display:inline-flex;align-items:center;gap:6px;padding:8px 0;font-size:13px;color:var(--muted);text-decoration:none}
.f-list a:hover{color:var(--fg)}
.f-addr{font-style:normal;display:flex;flex-direction:column;gap:12px;font-size:13px;line-height:1.55;color:var(--muted)}
.f-addr .k{display:block;font-size:11px;font-weight:600;color:var(--faint)}
.f-addr small{font-size:11px;color:var(--faint)}
.f-bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:4px 28px;border-top:1px solid var(--border);padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.f-bottom > .f-copy{grid-column:1;padding-top:12px}
.f-bottom > .f-legal{grid-column:1}
.f-bottom > .f-right{grid-column:2;grid-row:1 / span 2;justify-self:end;align-self:end}
.f-legal{display:flex;flex-wrap:wrap;gap:0 22px}
.f-bottom a,.f-bottom button{font-size:12px;color:var(--faint);text-decoration:none;padding:12px 0;background:none;border:0;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.f-bottom a:hover,.f-bottom button:hover{color:var(--fg2)}
.f-copy{font-size:12px;color:var(--faint)}
.f-right{display:flex;align-items:center;justify-content:flex-end;gap:8px 28px}
.f-loba{display:inline-flex;align-items:center;gap:12px;min-height:44px;color:var(--faint);text-decoration:none}
.f-loba:hover,.f-loba:focus-visible{color:#fff}
.f-loba-txt{font-size:11px;letter-spacing:.06em;white-space:nowrap;opacity:0;transform:translateX(8px);transition:opacity .35s ease,transform .35s ease}
.f-loba:hover .f-loba-txt,.f-loba:focus-visible .f-loba-txt{opacity:1;transform:none}
@media (hover:none){ .f-loba-txt{opacity:1;transform:none} }
@media (prefers-reduced-motion:reduce){ .f-loba-txt{transition:none} }
@media (max-width:960px){ .f-top{grid-template-columns:1fr} }
@media (max-width:600px){ .f-cols{grid-template-columns:1fr 1fr} .f-cols > :nth-child(2){grid-column:1 / -1;grid-row:2} .f-bottom{grid-template-columns:1fr} .f-bottom > .f-right{grid-column:1;grid-row:auto;justify-self:stretch;justify-content:space-between} }

/* ================= overlays ================= */
.cookie{position:fixed;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:90;max-width:460px;background:var(--surface);border:1px solid var(--border-2);border-radius:12px;box-shadow:0 10px 15px -3px #00000066;padding:20px;display:flex;flex-direction:column;gap:14px}
.cookie[hidden]{display:none}
.cookie p{font-size:13px;line-height:1.6;color:var(--fg2)}
.cookie .opts{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border);padding-top:14px}
.cookie .opts[hidden]{display:none}
.cookie .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cookie .btn{padding:0 10px}
.xdlg{width:min(520px,calc(100vw - 32px));padding:0;border:1px solid var(--border-2);border-radius:16px;background:var(--surface);color:var(--fg);box-shadow:0 25px 50px -12px #000000aa}
.xdlg::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.xdlg .bar{min-height:56px;padding:0 8px 0 22px;border-bottom:1px solid var(--border)}
.xdlg .in{padding:22px;display:flex;flex-direction:column;gap:14px}
.xdlg .target{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.xdlg .url{font-size:13px;color:var(--fg2);background:var(--band);border:1px dashed var(--border-2);border-radius:8px;padding:10px 12px;word-break:break-all}
/* ================= copy database v1: hero badge, trust bar, steps ================= */
.badge{align-self:flex-start;display:inline-flex;align-items:center;font-size:12px;font-weight:600;color:var(--fg2);background:rgba(9,9,11,.78);border:1px solid var(--border-2);border-radius:999px;padding:6px 14px}
.hero .display{font-size:clamp(48px,8.6vw,124px);max-width:11ch}
.hero > .ph{align-items:flex-end;justify-content:flex-start;padding:28px 24px}
.claim{font-size:15px;font-weight:600;color:var(--fg)}
.trust{background:var(--band)}
.trust-list{list-style:none;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 24px;padding-top:22px;padding-bottom:22px}
.trust-list li{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--fg)}
.trust-list li svg{margin-top:3px}
.trust-list .t{display:block;font-weight:600}
.trust-list .d{display:block;font-size:13px;line-height:1.5;color:var(--muted);margin-top:2px}
@media (max-width:1000px){ .trust-list{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:520px){ .trust-list{grid-template-columns:1fr} }
.steps{counter-reset:none}
.steps .num{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;border:1px solid var(--border-2);font-size:14px;font-weight:600;color:var(--fg);margin-bottom:6px}
.grid > li > .need{height:100%}
@media (min-width:1101px){ .g-5 .unit .name{font-size:18px} }

/* ================= router ================= */
const app = document.getElementById("app");
let unlocked = false, prev = { key:undefined, lang:undefined }, prefill = null;
function route(){
  let raw = location.hash.replace(/^#/, "") || "/";
  if (raw[0] !== "/") return;
  let path = raw.split("?")[0];
  if (path.length > 1 && path.endsWith("/")) path = path.slice(0, -1);
  const r = resolve(path);
  lang = r.lang;
  document.documentElement.lang = lang === "pt" ? "pt-PT" : "en";
  if (!unlocked){ renderGate(); return; }
  const key = r.key;
  let html;
  if (key === "home") html = V.home();
  else if (key === "storage" || key === "work") html = V.service(key);
  else if (key === "about") html = V.about();
  else if (key === "support") html = V.support();
  else if (key === "contact") html = V.contact();
  else if (key === "privacy" || key === "cookies" || key === "terms") html = V.legal(key);
  else html = V.notFound();
  const langOnly = prev.key === key && prev.lang !== lang;
  renderChrome(key);
  app.innerHTML = html;
  if (key === "contact" && prefill){
    const sel = app.querySelector("#f-subject"), msg = app.querySelector("#f-msg");
    if (sel) sel.value = t("subjects")[prefill[0]] || "";
    if (msg) msg.value = prefill[1] || "";
    prefill = null;
  }
  const seo = key && SEO[key];
  document.title = seo ? L(seo.title) : t("nf_title") + " | ROOM2";
  const md = document.querySelector('meta[name="description"]');
  if (md && seo && seo.desc) md.setAttribute("content", L(seo.desc));
  closeMenu(false);
  if (!cookieEl.hidden) renderCookie();
  if (!langOnly){
    window.scrollTo(0, 0);
    if (prev.key !== undefined){ const f = app.querySelector("[data-focus]"); if (f){ f.setAttribute("tabindex", "-1"); f.focus({ preventScroll:true }); } }
  }
  prev = { key, lang };
}
window.addEventListener("hashchange", route);

/* mobile menu, with focus kept inside while open */
const panel = document.getElementById("menuPanel");
function openMenu(){ panel.hidden = false; const b = document.getElementById("menuOpen"); if (b) b.setAttribute("aria-expanded", "true"); document.body.style.overflow = "hidden"; const c = document.getElementById("menuClose"); if (c) c.focus(); }
function closeMenu(restore){ if (panel.hidden) return; panel.hidden = true; document.body.style.overflow = ""; const b = document.getElementById("menuOpen"); if (b){ b.setAttribute("aria-expanded", "false"); if (restore) b.focus(); } }
panel.addEventListener("keydown", e => {
  if (e.key === "Escape"){ closeMenu(true); return; }
  if (e.key !== "Tab") return;
  const f = [...panel.querySelectorAll("a,button")].filter(x => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});
window.addEventListener("resize", () => { if (window.innerWidth > 1060) closeMenu(false); });

document.addEventListener("click", e => {
  const pf = e.target.closest("[data-prefill]");
  if (pf){ const parts = pf.dataset.prefill.split("|"); prefill = [Number(parts[0]), parts.slice(1).join("|")]; }
  const x = e.target.closest("[data-ext]");
  if (x){ e.preventDefault(); if (!panel.hidden) closeMenu(false); openExt(x); return; }
  if (e.target.closest("#menuOpen")){ openMenu(); return; }
  if (e.target.closest("#menuClose")){ closeMenu(true); return; }
  const sk = e.target.closest("[data-skip]");
  if (sk){ e.preventDefault(); app.focus(); return; }
  const sc = e.target.closest("[data-scroll]");
  if (sc){
    e.preventDefault();
    const el = document.querySelector(sc.dataset.scroll);
    if (el){ el.scrollIntoView({ behavior: reduce() ? "auto" : "smooth" }); const h = el.querySelector("h2"); if (h){ h.setAttribute("tabindex", "-1"); h.focus({ preventScroll:true }); } }
    return;
  }
  const sl = e.target.closest("[data-slide]");
  if (sl){
    const g = document.getElementById("gal"); if (!g) return;
    const first = g.firstElementChild, step = first ? first.getBoundingClientRect().width + 16 : 300;
    g.scrollBy({ left: step * Number(sl.dataset.slide), behavior: reduce() ? "auto" : "smooth" });
    return;
  }
  if (e.target.closest("#backTop")){ window.scrollTo({ top:0, behavior: reduce() ? "auto" : "smooth" }); const f = app.querySelector("[data-focus]"); if (f){ f.setAttribute("tabindex", "-1"); f.focus({ preventScroll:true }); } return; }
  if (e.target.closest("[data-cookie-open]")){ showCookie(true); return; }
  if (e.target.closest("[data-maps-ok]")){ consent = Object.assign({ analytics:false }, consent || {}, { maps:true }); refreshMap(); hideCookie(); return; }
  if (e.target.closest("#again")){
    const form = document.getElementById("cform"), sent = document.getElementById("sent");
    form.reset(); form.hidden = false; sent.hidden = true; document.getElementById("f-name").focus(); return;
  }
});

    const w = new Array(64);
    for (let i = 0; i < 16; i++) w[i] = (bytes[o+i*4]<<24)|(bytes[o+i*4+1]<<16)|(bytes[o+i*4+2]<<8)|bytes[o+i*4+3];
    for (let i = 16; i < 64; i++){ const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3), s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
    let [a,b,c,d,e,f,g,hh]=h;
    for (let i = 0; i < 64; i++){ const t1=(hh+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0, t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))|0; hh=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0; }
    h=h.map((v,i)=>(v+[a,b,c,d,e,f,g,hh][i])|0);
  }
  return h.map(v=>(v>>>0).toString(16).padStart(8,"0")).join("");
}
const gate = document.getElementById("gate");
function renderGate(){
  document.title = "ROOM2 — Wireframe";
  const typed = document.getElementById("gatePw");
  const val = typed ? typed.value : "";
  gate.innerHTML = `${ph("hero", "")}
  <form id="gateForm" novalidate aria-labelledby="gateTitle">
    <div class="lang" role="group" aria-label="${esc(t("lang_group"))}" style="align-self:flex-start;margin-bottom:-8px">
      <a href="#/" lang="pt-PT" aria-label="Português" aria-current="${lang === "pt"}">PT</a><span class="sep" aria-hidden="true">|</span><a href="#/en" lang="en" aria-label="English" aria-current="${lang === "en"}">EN</a></div>
    <h1 id="gateTitle" class="logo">room2</h1>
    <p class="sig" lang="en" style="border:0;padding:0">Flexible workspaces &amp; storage</p>
    <p class="note">${esc(t("g_note"))}</p>
    <div class="field"><label for="gatePw">${esc(t("g_pw"))}</label>
      <div class="pw"><input id="gatePw" type="password" autocomplete="current-password" aria-describedby="gateErr"><button class="show" type="button" id="gateShow" aria-pressed="false" aria-controls="gatePw">${esc(t("g_show"))}</button></div>
      <span class="err" id="gateErr" role="alert" hidden>${esc(t("g_err"))}</span></div>
    <button class="btn btn-solid" type="submit">${esc(t("g_enter"))}</button>
  </form>`;
  const pw = document.getElementById("gatePw"); pw.value = val; pw.focus();
  pw.addEventListener("input", () => { document.getElementById("gateErr").hidden = true; pw.setAttribute("aria-invalid", "false"); });
  document.getElementById("gateShow").addEventListener("click", function(){
    const show = pw.type === "password"; pw.type = show ? "text" : "password";
    this.setAttribute("aria-pressed", String(show)); this.textContent = show ? t("g_hide") : t("g_show"); pw.focus();
  });
}
function tryGate(){
  const pw = document.getElementById("gatePw");
  if (sha256hex(pw.value.trim().toLowerCase()) === GATE_HASH){ unlock(); return; }
  document.getElementById("gateErr").hidden = false; pw.setAttribute("aria-invalid", "true"); pw.select();
  const f = document.getElementById("gateForm"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
}
function unlock(){
  try { sessionStorage.setItem("room2-preview", GATE_HASH); } catch(e){}
  gate.remove(); document.body.classList.remove("locked"); unlocked = true;
  route(); showCookie(false);
}
let remembered = false;
try { remembered = sessionStorage.getItem("room2-preview") === GATE_HASH; } catch(e){}
if (remembered) unlock(); else route();
})();
